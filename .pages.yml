# Pages CMS configuration: https://pagescms.org
# Log in at https://app.pagescms.org with GitHub and open this repository.
media:
  input: public/images
  output: /images

content:
  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    filename: "{fields.slug}.md"
    view:
      fields: [title, topic, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL slug, type: string, required: true, description: "lowercase-words-with-dashes. Changing it changes the URL, so add a redirect." }
      - { name: seoTitle, label: SEO title (optional), type: string, description: "Shown in Google. Aim for 50-60 characters." }
      - { name: description, label: Meta description, type: text, description: "Aim for 140-160 characters." }
      - { name: date, label: Published, type: date, required: true }
      - { name: updated, label: Last updated, type: date }
      - name: topic
        label: Topic
        type: select
        required: true
        options: { values: [AI, AEO, SEO, Healthcare AEO] }
      - { name: pillar, label: Pillar guide, type: boolean, default: false }
      - { name: draft, label: Draft (hidden), type: boolean, default: false }
      - { name: image, label: Featured image, type: image }
      - { name: body, label: Body, type: rich-text }

  - name: services
    label: Services
    type: collection
    path: src/content/services
    view:
      fields: [title, order]
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: navLabel, label: Short name, type: string, required: true, description: "Used in buttons, e.g. 'Talk about AEO'" }
      - { name: seoTitle, label: SEO title, type: string }
      - { name: description, label: Meta description, type: text }
      - { name: summary, label: One-line summary, type: text, required: true }
      - { name: order, label: Order, type: number }
      - name: topic
        label: Related blog topic
        type: select
        options: { values: [AI, AEO, SEO, Healthcare AEO] }
      - { name: offers, label: What you can hire me for, type: string, list: true }
      - { name: proof, label: What I have done, type: string, list: true }
      - { name: work, label: Related case study slugs, type: string, list: true }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: body, label: Body, type: rich-text }

  - name: work
    label: Case studies
    type: collection
    path: src/content/work
    view:
      fields: [title, client, draft]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: seoTitle, label: SEO title, type: string }
      - { name: client, label: Client, type: string, required: true }
      - { name: sector, label: Sector, type: string }
      - { name: year, label: Year, type: string }
      - { name: link, label: Project link, type: string }
      - { name: summary, label: Summary, type: text, required: true }
      - { name: description, label: Meta description, type: text }
      - { name: order, label: Order, type: number }
      - { name: draft, label: Draft (hidden), type: boolean, default: false }
      - { name: services, label: Service slugs, type: string, list: true }
      - name: results
        label: Headline results
        type: object
        list: true
        fields:
          - { name: value, label: Number, type: string }
          - { name: label, label: Label, type: string }
      - { name: body, label: Body, type: rich-text }

  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    view:
      fields: [title]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: seoTitle, label: SEO title, type: string }
      - { name: description, label: Meta description, type: text }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: body, label: Body, type: rich-text }

  - name: home
    label: Home page
    type: file
    path: src/data/home.json
    format: json
    fields:
      - { name: seoTitle, label: SEO title, type: string }
      - { name: metaDescription, label: Meta description, type: text }
      - { name: query, label: Question in the bubble, type: string }
      - { name: answer, label: Headline answer, type: text, description: "Wrap highlighted phrases in ==double equals== and add [1], [2], [3] right after a phrase to link it to that source below." }
      - name: sources
        label: Sources (numbered in order)
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Link, type: string }
      - name: primaryButton
        label: Main button
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Link, type: string }
      - name: secondaryButton
        label: Second button
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Link, type: string }
      - { name: servicesHeading, label: Services heading, type: string }
      - { name: servicesIntro, label: Services intro, type: text }
      - { name: buildLabel, label: AI services column title, type: string }
      - { name: foundLabel, label: Search services column title, type: string }
      - { name: workHeading, label: Work heading, type: string }
      - { name: workIntro, label: Work intro, type: text }
      - { name: writingHeading, label: Writing heading, type: string }
      - { name: writingIntro, label: Writing intro, type: text, description: "Links: [text](/url/)" }
      - { name: aboutHeading, label: About heading, type: string }
      - { name: about, label: About paragraphs, type: text, list: true, description: "Links: [text](/url/)" }

  - name: navigation
    label: Menu
    type: file
    path: src/data/navigation.json
    format: json
    fields:
      - name: items
        label: Menu items
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: href, label: Link, type: string, required: true }
          - name: children
            label: Dropdown items
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
      - name: cta
        label: Header button
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Link, type: string }

  - name: settings
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Name, type: string }
      - { name: legalName, label: Full legal name, type: string }
      - { name: jobTitle, label: Job title, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: description, label: Default meta description, type: text }
      - { name: email, label: Public email, type: string }
      - { name: location, label: Location, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: formEndpoint, label: Contact form endpoint, type: string, description: "e.g. https://api.web3forms.com/submit (leave empty to show email only)" }
      - { name: formAccessKey, label: Contact form access key, type: string }
      - { name: footerNote, label: Footer note, type: string }
