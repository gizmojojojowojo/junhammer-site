<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060e47"/><stop offset="1" stop-color="#0b3a8c"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="lens"><circle cx="600" cy="290" r="93"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".08" fill="#fff">
    <circle cx="1080" cy="90" r="210"/><circle cx="120" cy="580" r="190"/>
  </g>

  <!-- connectors: page to lens, lens to answer -->
  <g fill="none" stroke="#f2c6d1" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12">
    <path d="M390 315 C 440 315, 460 292, 500 290"/>
    <path d="M700 290 C 740 292, 760 315, 806 315"/>
  </g>

  <!-- website page card -->
  <g filter="url(#sh)" transform="translate(90 165)">
    <rect width="300" height="300" rx="22" fill="#f6f3f4"/>
    <path d="M0 22 a22 22 0 0 1 22 -22 h256 a22 22 0 0 1 22 22 v26 h-300z" fill="#0b3a8c"/>
    <g fill="#f2c6d1"><circle cx="28" cy="24" r="7"/><circle cx="50" cy="24" r="7"/><circle cx="72" cy="24" r="7"/></g>
    <rect x="28" y="76" width="150" height="18" rx="9" fill="#0b1238"/>
    <rect x="28" y="112" width="244" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="28" y="134" width="220" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="28" y="156" width="180" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="28" y="194" width="110" height="78" rx="12" fill="#a9bfff"/>
    <path d="M44 258 l26 -30 18 20 12 -12 22 22z" fill="#0b3a8c"/>
    <circle cx="112" cy="214" r="8" fill="#f6f3f4"/>
    <rect x="156" y="198" width="116" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="156" y="220" width="96" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="156" y="246" width="70" height="24" rx="8" fill="#a1596c"/>
  </g>

  <!-- AI answer card -->
  <g filter="url(#sh)" transform="translate(810 135)">
    <rect width="300" height="360" rx="22" fill="#ffffff"/>
    <circle cx="44" cy="46" r="20" fill="#0b3a8c"/>
    <path d="M44 33 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#f2c6d1"/>
    <rect x="76" y="37" width="120" height="17" rx="8.5" fill="#0b1238"/>
    <rect x="28" y="94" width="244" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="28" y="116" width="220" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="28" y="138" width="236" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="28" y="160" width="160" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="28" y="194" width="230" height="11" rx="5.5" fill="#ddd5db"/>
    <rect x="28" y="216" width="190" height="11" rx="5.5" fill="#ddd5db"/>
    <!-- citation chips: two filled, one empty slot -->
    <g transform="translate(28 262)">
      <rect width="72" height="60" rx="12" fill="#f6f3f4" stroke="#ddd5db" stroke-width="2"/><circle cx="36" cy="30" r="13" fill="#0b3a8c"/>
      <rect x="86" width="72" height="60" rx="12" fill="#f6f3f4" stroke="#ddd5db" stroke-width="2"/><circle cx="122" cy="30" r="13" fill="#45094b"/>
      <rect x="172" width="72" height="60" rx="12" fill="none" stroke="#a1596c" stroke-width="3" stroke-dasharray="8 7"/>
      <rect x="198" y="27" width="20" height="6" rx="3" fill="#a1596c"/>
    </g>
  </g>

  <!-- magnifier handle (behind lens rim) -->
  <path d="M668 358 L742 432" stroke="#a1596c" stroke-width="30" stroke-linecap="round"/>
  <path d="M668 358 L742 432" stroke="#45094b" stroke-width="10" stroke-linecap="round" opacity=".35"/>

  <!-- lens -->
  <circle cx="600" cy="290" r="100" fill="#0f1542"/>
  <g clip-path="url(#lens)">
    <g opacity=".18" stroke="#a9bfff" stroke-width="2">
      <path d="M500 230 H700 M500 290 H700 M500 350 H700 M540 190 V390 M600 190 V390 M660 190 V390"/>
    </g>
    <!-- broken chain: two links with a gap -->
    <g fill="none" stroke="#f2c6d1" stroke-width="13" stroke-linecap="round">
      <path d="M574 268 H536 a22 22 0 0 0 0 44 H574"/>
      <path d="M626 268 H664 a22 22 0 0 1 0 44 H626"/>
    </g>
    <g stroke="#a9bfff" stroke-width="6" stroke-linecap="round">
      <path d="M600 244 V258"/><path d="M600 322 V336"/>
      <path d="M582 252 L588 262"/><path d="M618 252 L612 262"/>
      <path d="M582 328 L588 318"/><path d="M618 328 L612 318"/>
    </g>
  </g>
  <circle cx="600" cy="290" r="100" fill="none" stroke="#f6f3f4" stroke-width="14"/>
  <path d="M540 230 A84 84 0 0 1 590 208" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".5"/>

  <!-- three check stages under the lens -->
  <g transform="translate(470 470)">
    <path d="M30 30 H230" stroke="#4d5172" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="24" fill="#f2c6d1"/>
    <path d="M19 30 l8 8 14 -16" stroke="#0b1238" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="130" cy="30" r="24" fill="#f2c6d1"/>
    <path d="M119 30 l8 8 14 -16" stroke="#0b1238" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="230" cy="30" r="24" fill="#0f1542" stroke="#a1596c" stroke-width="4"/>
    <circle cx="230" cy="30" r="6" fill="#a1596c"/>
  </g>
</svg>
