<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#060e47" flood-opacity=".25"/></filter>
  </defs>
  <rect width="600" height="630" fill="#f6f3f4"/>
  <rect x="600" width="600" height="630" fill="#060e47"/>
  <path d="M60 520 H 600" stroke="#0b3a8c" stroke-width="4" opacity=".35"/><path d="M600 520 H 1140" stroke="#f2c6d1" stroke-width="4" opacity=".35"/>
  <!-- four rising levels -->
  <g filter="url(#sh)">
    <rect x="110" y="400" width="190" height="120" rx="18" fill="#ffffff" stroke="#0b3a8c" stroke-width="4"/>
    <rect x="360" y="300" width="190" height="220" rx="18" fill="#0b3a8c"/>
    <rect x="650" y="200" width="190" height="320" rx="18" fill="#a1596c"/>
    <rect x="900" y="100" width="190" height="420" rx="18" fill="#f2c6d1"/>
  </g>
  <!-- level 1: a single small spark -->
  <circle cx="205" cy="460" r="14" fill="#f2c6d1"/>
  <!-- level 2: two connected nodes -->
  <g stroke="#f2c6d1" stroke-width="4"><path d="M425 400 H 485"/></g>
  <circle cx="425" cy="400" r="14" fill="#f2c6d1"/><circle cx="485" cy="400" r="14" fill="#ffffff"/>
  <!-- level 3: a redesigned loop -->
  <g fill="none" stroke="#ffffff" stroke-width="4"><circle cx="745" cy="330" r="46"/></g>
  <circle cx="745" cy="284" r="12" fill="#f2c6d1"/><circle cx="791" cy="330" r="12" fill="#ffffff"/><circle cx="745" cy="376" r="12" fill="#f2c6d1"/><circle cx="699" cy="330" r="12" fill="#ffffff"/>
  <!-- level 4: core with spokes -->
  <g stroke="#45094b" stroke-width="4" stroke-linecap="round">
    <path d="M995 270 L 995 200"/><path d="M995 270 L 1055 235"/><path d="M995 270 L 1055 305"/><path d="M995 270 L 995 340"/><path d="M995 270 L 935 305"/><path d="M995 270 L 935 235"/>
  </g>
  <circle cx="995" cy="270" r="26" fill="#45094b"/><circle cx="995" cy="270" r="10" fill="#ffffff"/>
  <g fill="#45094b"><circle cx="995" cy="200" r="9"/><circle cx="1055" cy="235" r="9"/><circle cx="1055" cy="305" r="9"/><circle cx="995" cy="340" r="9"/><circle cx="935" cy="305" r="9"/><circle cx="935" cy="235" r="9"/></g>
</svg>
